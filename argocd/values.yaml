# Argo CD's own settings for the lab. Chart: argo-cd 10.10.5 from https://argoproj.github.io/argo-helm
# (Argo CD 3.5.5). Installed by ./bootstrap. Design: docs/superpowers/specs/2026-10-15-argocd-design.md

# Platform tools run on the on-demand system pool, so a Spot reclaim cannot stop the controller in
# the middle of a change. Tenant apps run on apps (Spot).
global:
  nodeSelector:
    pool: system
    kubernetes.io/os: linux

configs:
  params:
    # The screen is reached only through ./k port-forward, which already runs inside kubectl's
    # encrypted connection to the cluster; plain HTTP here avoids a browser certificate warning.
    server.insecure: true

# Not used in the lab: single sign-on (the one user signs in as admin) and notifications.
dex:
  enabled: false
notifications:
  enabled: false

# Requests, so the scheduler places the pods knowing what they need. Sized for one small app.
controller:
  resources:
    requests: {cpu: 250m, memory: 512Mi}
repoServer:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
server:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
redis:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
applicationSet:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
