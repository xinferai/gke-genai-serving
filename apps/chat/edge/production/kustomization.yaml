# production's public entrance: the shared base, answering to production's hostname on both routes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target:
      kind: HTTPRoute
    patch: |-
      - op: add
        path: /spec/hostnames
        value: [chat-lab.liveinference.com]
