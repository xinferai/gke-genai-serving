# Public HTTPS entrance to the chat app, shared by both environments. Each environment's overlay
# (apps/chat/edge/<env>) adds its hostname to the two routes; Argo CD applies the overlay as the app chat-edge.
# GKE turns the Gateway into a global external Application Load Balancer (the AWS equivalent is
# an ALB made by the AWS Load Balancer Controller). The IP address, certificate map and Cloud
# Armor policy it names come from envs/<env>/edge. Only the page and its API (Open WebUI) are
# published; Ollama has no authentication and stays internal.
# The IP address, certificate map and Cloud Armor policy are named chat-lab in both projects.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: chat
  namespace: chat
  annotations:
    networking.gke.io/certmap: chat-lab
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: chat-lab
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chat
  namespace: chat
spec:
  parentRefs:
    - name: chat
      sectionName: https
  rules:
    - backendRefs:
        - name: chat-open-webui
          port: 80
---
# Plain HTTP only redirects to HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chat-redirect
  namespace: chat
spec:
  parentRefs:
    - name: chat
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# The load balancer sends traffic only to pods that answer /health.
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: chat-open-webui
  namespace: chat
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /health
  targetRef:
    group: ""
    kind: Service
    name: chat-open-webui
---
# Cloud Armor in front of the page, and a 10-minute backend timeout: the default of 30 seconds
# would cut off long streamed answers and the page's live connection.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: chat-open-webui
  namespace: chat
spec:
  default:
    securityPolicy: chat-lab
    timeoutSec: 600
  targetRef:
    group: ""
    kind: Service
    name: chat-open-webui
