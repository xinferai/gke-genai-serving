# main's public entrance: the shared base, answering to main's hostname on both routes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target:
      kind: HTTPRoute
    patch: |-
      - op: add
        path: /spec/hostnames
        value: [chat-lab-main.liveinference.com]
